name: Realitny monitor

on:
  schedule:
    # každých 10 minút (GitHub to niekedy o pár minút posunie)
    # pri SÚKROMNOM repozitári zmeň na "*/30 * * * *", aby si sa zmestil do bezplatného limitu
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rezim:
        description: "raz = normálna kontrola, test = len ukáže čo nájde + testovacia správa"
        required: true
        default: "test"
        type: choice
        options: [test, raz]

permissions:
  contents: write

concurrency:
  group: realitny-monitor
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Inštalácia
        run: pip install -r requirements.txt

      - name: Kontrola inzerátov
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PREDAJ: ${{ secrets.TELEGRAM_CHAT_ID_PREDAJ }}
          TELEGRAM_CHAT_ID_NAJOM: ${{ secrets.TELEGRAM_CHAT_ID_NAJOM }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py --${{ github.event.inputs.rezim || 'raz' }}

      - name: Uloženie pamäte (videné inzeráty)
        if: always()
        run: |
          git config user.name "realitny-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add -f videne.db obce_sk.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
          else
            git commit -m "pamäť monitora $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs || true
            git push
          fi
