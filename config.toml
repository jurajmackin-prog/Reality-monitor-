# =====================================================================
#  REALITNÝ MONITOR – nastavenia (západné Slovensko)
#  Riadky začínajúce # sú poznámky, program ich ignoruje.
# =====================================================================

[telegram]
# PREDAJ a NÁJOM chodia vždy oddelene (🏠 PREDAJ / 🔑 NÁJOM).
# Chceš ich mať v dvoch rôznych Telegram chatoch? Pridaj do GitHub Secrets
# TELEGRAM_CHAT_ID_PREDAJ a/alebo TELEGRAM_CHAT_ID_NAJOM (inak ide všetko do TELEGRAM_CHAT_ID).
# Na GitHube token a chat_id NEPÍŠ SEM – vlož ich do Settings → Secrets (TELEGRAM_TOKEN, TELEGRAM_CHAT_ID).
# Sem ich vyplň len ak to spúšťaš na vlastnom počítači/serveri.
token = ""
chat_id = ""

[email]
# E-maily cez Gmail. Na GitHube NEPÍŠ SEM – vlož do Secrets: EMAIL_USER, EMAIL_APP_PASSWORD (a voliteľne EMAIL_TO).
# Z každej kontroly príde najviac 1 e-mail so všetkými novými inzerátmi, zoradenými podľa okresov.
od = ""                 # tvoj Gmail, napr. "juraj.mackin@gmail.com"
heslo_aplikacie = ""    # 16-miestne heslo aplikácie (nie tvoje bežné heslo!)
komu = ""               # prázdne = na ten istý Gmail; viac adries oddeľ čiarkou

[nastavenia]
# ČO SLEDOVAŤ NA BAZOŠI (Nehnutelnosti.sk berie to, čo máš zvolené priamo na portáli):
#   "byt", "dom", "pozemok", "chata", "garaz", "kancelaria", "priestor", "ostatne"
druhy = ["byt", "dom", "pozemok", "chata", "garaz"]
interval_minut = 10        # ako často kontrolovať (min. 3, odporúčam 5–15)
strany = 5                 # koľko strán výsledkov max. prejsť (zastaví skôr, keď narazí na už videné)
max_samostatnych_sprav = 5 # viac nových naraz → príde jeden súhrn (súkromníci navrchu)
otvarat_detail = true      # otvorí každý NOVÝ inzerát → zistí cenu a či je to súkromník
iba_sukromnici = true      # true = inzeráty od realitiek vôbec neposielať (pri celom západe odporúčam)

# --- OKRESY ---
# Každá správa ukáže okres (📍) a súhrny sú zoskupené podľa okresov.
# Ak chceš dostávať len niektoré okresy, vypíš ich sem. Prázdne [] = všetky.
# "Bratislava" = všetky Bratislava I–V.
#
# Bratislavský:  Bratislava I, Bratislava II, Bratislava III, Bratislava IV, Bratislava V,
#                Malacky, Pezinok, Senec
# Trnavský:      Dunajská Streda, Galanta, Hlohovec, Piešťany, Senica, Skalica, Trnava
# Nitriansky:    Komárno, Levice, Nitra, Nové Zámky, Šaľa, Topoľčany, Zlaté Moravce
# Trenčiansky:   Bánovce nad Bebravou, Ilava, Myjava, Nové Mesto nad Váhom, Partizánske,
#                Považská Bystrica, Prievidza, Púchov, Trenčín
# Predvolene celé západné Slovensko (inzeráty z iných krajov sa nepošlú).
# Chceš menej? Nechaj v zozname len tie, ktoré ťa zaujímajú.
okresy = [
  "Bratislava", "Malacky", "Pezinok", "Senec",
  "Dunajská Streda", "Galanta", "Trnava",
]
posielat_neznamy_okres = true   # keď sa okres nedá určiť, poslať aj tak?

cena_od = 0                # 0 = bez limitu
cena_do = 0                # napr. 250000
musi_obsahovat = []        # aspoň jedno slovo, napr. ["balkón", "loggia", "terasa"]
nesmie_obsahovat = ["dražba", "drazba", "spoluvlastnícky podiel", "podiel 1/"]

# ---------------------------------------------------------------------
#  CENY ZVLÁŠŤ PRE PREDAJ A NÁJOM
#  (prepíšu spoločné nastavenia vyššie; 0 = bez limitu)
# ---------------------------------------------------------------------
[nastavenia.predaj]
cena_od = 0
cena_do = 0          # napr. 250000

[nastavenia.najom]
cena_od = 0
cena_do = 0          # napr. 900  (€ mesačne)

# ---------------------------------------------------------------------
#  HĽADANIA – OKRUH 40 KM OKOLO BRATISLAVY
#  Každé hľadanie má typ = "predaj" alebo "najom".
#  Rovnaký inzerát z viacerých hľadaní príde len raz.
#
#  Ďalší portál pridáš tak, že naň v prehliadači nastavíš byty, predaj
#  alebo prenájom, 4 západné kraje, zoradenie OD NAJNOVŠÍCH a skopíruješ
#  adresu do url = "..." (a nastavíš správny typ).
# ---------------------------------------------------------------------

# ===================== 🏠 PREDAJ =====================
# Okruh 40 km okolo Bratislavy

[[hladanie]]
typ = "predaj"
nazov = "Bazoš predaj BA +40 km"
url = "https://reality.bazos.sk/predam/{druh}/?hledat=&rubriky=reality&hlokalita=81101&humkreis=40&cenaod=&cenado=&order="

[[hladanie]]
typ = "predaj"
nazov = "Nehnutelnosti.sk predaj"
# všetky druhy, lokality podľa tvojho výberu na portáli
url = "https://www.nehnutelnosti.sk/vysledky/predaj?locations=0_i9128BtwC-IGpZQrnK&locations=100010663&locations=100010659&locations=100001009&locations=100010651&locations=100010555&locations=100010306&order=NEWEST"
strany = 3

[[hladanie]]
typ = "predaj"
nazov = "Reality.sk – predaj"
url = ""

[[hladanie]]
typ = "predaj"
nazov = "TopReality.sk – predaj"
url = ""

# ===================== 🔑 NÁJOM =====================

[[hladanie]]
typ = "najom"
nazov = "Bazoš nájom BA +40 km"
# druhy = ["byt", "dom"]   # ← odkomentuj, ak chceš pri nájme len niektoré druhy
url = "https://reality.bazos.sk/prenajmu/{druh}/?hledat=&rubriky=reality&hlokalita=81101&humkreis=40&cenaod=&cenado=&order="

[[hladanie]]
typ = "najom"
nazov = "Nehnutelnosti.sk nájom"
url = "https://www.nehnutelnosti.sk/vysledky/prenajom?locations=0_i9128BtwC-IGpZQrnK&locations=100010663&locations=100010659&locations=100001009&locations=100010651&locations=100010555&locations=100010306&order=NEWEST"
strany = 3

[[hladanie]]
typ = "najom"
nazov = "Reality.sk – prenájom"
url = ""

[[hladanie]]
typ = "najom"
nazov = "TopReality.sk – prenájom"
url = ""
